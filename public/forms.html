<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Forms</title></head>
<body hidden>
<!-- Static copy of the proposal form so Netlify detects it at deploy time. Field names match the current site. -->
<form name="otel-teklif" data-netlify="true" netlify-honeypot="bot-field" method="POST">
  <input type="hidden" name="form-name" value="otel-teklif">
  <input name="bot-field">
  <input name="lead_cta"><input name="lead_page"><input name="landing_page"><input name="referrer">
  <input name="utm_source"><input name="utm_medium"><input name="utm_campaign">
  <input name="interest"><input name="project"><input name="lang">
  <select name="property_type"><option></option></select>
  <input name="city"><input name="contact_name"><input name="contact" type="email"><input name="whatsapp" type="tel">
  <input name="company"><input name="date"><select name="budget"><option></option></select><select name="currency"><option></option></select>
  <select name="guests"><option></option></select><textarea name="notes"></textarea><input type="checkbox" name="kvkk" value="evet">
</form>
</body></html>
